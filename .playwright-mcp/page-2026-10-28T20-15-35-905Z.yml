        - paragraph [ref=e717]:
          - strong [ref=e718]: Oakhouse Co., Ltd. is a share house management company founded in 1992.
          - text: All the buildings listed on this site are directly-managed and original to Oakhouse. Room vacancy information is updated every 15 minutes, for faster and more accurate information than other portal sites. Information about new houses and special deals only found on this site are also updated regularly, and registered members can also receive official PAO points that can be used toward monthly rent. Questions and other inquiries can be made in Japanese, English, Korean, Chinese, and French through the online help desk 24 hours a day.
