# Build the Astro site and deploy it to GitHub Pages, scraping oakhouse.jp, x-house.co.jp and LIFULL HOME'S Monthly
# (api.monthly-homes.jp) first when needed:
#   - daily run triggered by cron-job.org (workflow_dispatch), or a manual run with "scrape" ticked
#     → fresh scrape
#   - any push (whatever it touches, scraper/ included) → reuse the data already on the live site.
#     Pushes never scrape: if that download fails (site down, or a change added a data file the live
#     site doesn't have yet), the run fails and the previous deployment stays live. Scraper changes
#     take effect at the next daily run; run manually with "scrape" ticked to apply them sooner.
# Scraped listings are never committed: they live in the Pages deployment. Reference data that
# rarely changes is committed (scraper/geocode.json, web/src/data/stations.json + lines.json).
# Run state kept between runs lives in actions/cache: last successful counts, Xross detail pages
# (refetched weekly, not daily), Xross address lookups and LIFULL's city lists (refetched weekly).
name: Scrape & deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scrape:
        description: Scrape the listing sites (untick to just rebuild with the current live data)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Oakhouse, Xross and LIFULL scrape in parallel; Xross's room lists are capped at 30/min, so a run takes ~1 h
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to scrape
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SCRAPE: ${{ inputs.scrape }}
        run: bash .github/scripts/should-scrape.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.scrape == 'false'
        with:
          node-version: 24

      # Fails the run if any file is missing; pushes never fall back to scraping (only the daily run scrapes)
      - name: Reuse deployed data
        id: pull
        if: steps.mode.outputs.scrape == 'false'
        run: node web/scripts/data-pull.mjs

      - name: Explain failed reuse
        if: failure() && steps.pull.outcome == 'failure'
        run: |
          {
            echo "### Couldn't reuse the live site's data"
            echo "A data file is missing on the live site (a change added a new one, or the site is down). Nothing was scraped."
            echo "Run **Actions → Scrape & deploy** with \"scrape\" ticked to rebuild the data."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        if: steps.mode.outputs.scrape == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        if: steps.mode.outputs.scrape == 'true'
        run: pip install -r scraper/requirements.txt

      # Caches are immutable, so save under a new key every run and restore the newest by prefix.
      # Saved only when the job succeeds, so a failed scrape never replaces the last good state.
      - name: Restore scraper state
        if: steps.mode.outputs.scrape == 'true'
        uses: actions/cache@v6
        with:
          path: |
            scraper/.cache/last-good.json
            scraper/.cache/xross/detail
            scraper/.cache/lifull/cities
            scraper/xross-geocode.json
          key: scraper-state-${{ github.run_id }}
          restore-keys: scraper-state-

      # Downloads only (~1 h: Xross room lists are capped at 30/min; LIFULL's JSON API takes ~4 min alongside);
      # writes scraper/.cache/manifest.json.
      # Fails if Xross blocks us or too many of its listings fail; the previous deployment stays live.
      - name: Scrape listings
        if: steps.mode.outputs.scrape == 'true'
        working-directory: scraper
        run: python build.py fetch

      # Parses the downloaded pages, geocodes (Nominatim, GSI), finds nearest stations, maps amenities and
      # writes the site's data. Exits non-zero if any site's listing count drops >10% vs. the last good
      # run; the job then stops and the previous deployment stays live.
      - name: Parse & enrich
        if: steps.mode.outputs.scrape == 'true'
        working-directory: scraper
        run: python build.py process

      - name: Build site
        uses: withastro/action@v6
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
